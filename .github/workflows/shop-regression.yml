name: Shop appointment and regression checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/appointment-foundation-20261031]
jobs:
  app-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Python compilation
        run: python -m compileall -q app tests
      - name: Appointment unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Route and template smoke test
        env:
          DATABASE_URL: sqlite:///./ci_shop.db
          SECRET_KEY: ci-only-test-key
          APP_READ_ONLY: 'true'
        run: |
          python - <<'PY'
          from app.main import app
          from app.database import Base, engine
          from app.appointment_model import Appointment
          from fastapi.testclient import TestClient
          assert any(r.path == '/appointments/calendar' for r in app.routes)
          assert any(r.path == '/appointments/' and 'POST' in r.methods for r in app.routes)
          assert any(r.path == '/ro/new' for r in app.routes)
          Base.metadata.create_all(engine)
          with TestClient(app) as client:
              assert client.get('/healthz').status_code == 200
              assert client.get('/readyz').status_code == 200
              assert client.get('/appointments/calendar').status_code == 401
              assert client.get('/appointments/').status_code == 401
              assert client.post('/appointments/', json={'repair_order_id':1,'resource_id':'bay-1','starts_at':'2026-11-02T10:00:00-07:00','ends_at':'2026-11-02T11:00:00-07:00'}).status_code == 503
          PY
