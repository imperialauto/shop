name: Quo messaging regression tests
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'app/**'
      - 'tests/**'
      - 'messaging/**'
      - '.github/workflows/quo-tests.yml'
  push:
    branches:
      - fix/quo-communication-idempotency
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite://
      SECRET_KEY: ci-test-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt pytest passlib
      - name: Dispatch recovery tests
        run: node --test messaging/tests/dispatchRecovery.test.js messaging/tests/dispatchActions.test.js messaging/tests/quoContacts.test.js messaging/tests/callIntake.test.js messaging/tests/callEvents.test.js messaging/tests/ownerAssistant.test.js
      - name: Project status natural-language tests (synthetic GitHub data)
        run: node --test messaging/tests/projectStatus.test.js
      - name: Imperial brain source routing tests (synthetic records)
        run: node --test messaging/tests/imperialBrain.test.js messaging/tests/devWorkIntake.test.js messaging/tests/devWorkNotices.test.js
      - name: Call and SMS draft revalidation (synthetic Quo)
        run: node --test messaging/tests/replyContext.test.js
      - name: Run isolated Quo, Imperial tasks and lead lifecycle tests
        run: python -m pytest tests/test_quo_idempotency.py tests/test_imperial_tasks.py tests/test_service_leads.py tests/test_dispatch.py -q

      - name: Private owner SMS-to-dashboard integration (synthetic, loopback only)
        env:
          SHOP_APP_API_URL: http://127.0.0.1:18765
          INTERNAL_API_KEY: local-integration-fixture-key
          IMPERIAL_BRAIN_ENABLED: 'true'
          IMPERIAL_TASKS_ENABLED: 'true'
          OWNER_TEXTS_ENABLED: 'true'
          PROJECT_STATUS_ENABLED: 'false'
          AUTO_REPLIES_ENABLED: 'false'
        run: |
          set -euo pipefail
          PYTHONPATH=. python tests/imperial_sms_integration_server.py &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 50); do
            if curl --fail --silent http://127.0.0.1:18765/healthz > /dev/null; then break; fi
            sleep 0.2
          done
          curl --fail --silent http://127.0.0.1:18765/healthz > /dev/null
          node tests/imperial_sms_integration.test.js
