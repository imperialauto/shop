name: Quo messaging regression tests
on:
  pull_request:
    paths:
      - 'app/**'
      - 'tests/**'
      - '.github/workflows/quo-tests.yml'
  push:
    branches:
      - fix/quo-communication-idempotency
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite://
      SECRET_KEY: ci-test-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install pytest fastapi sqlalchemy python-dotenv python-multipart jinja2 passlib bcrypt httpx
      - name: Run isolated Quo tests
        run: python -m pytest tests/test_quo_idempotency.py -q
