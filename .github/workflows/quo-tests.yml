name: Quo messaging regression tests
on:
  pull_request:
    paths:
      - 'app/**'
      - 'tests/**'
      - 'messaging/**'
      - '.github/workflows/quo-tests.yml'
  push:
    branches:
      - fix/quo-communication-idempotency
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite://
      SECRET_KEY: ci-test-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install pytest fastapi sqlalchemy python-dotenv python-multipart jinja2 passlib bcrypt httpx
      - name: Dispatch recovery tests
        run: node --test messaging/tests/dispatchRecovery.test.js messaging/tests/dispatchActions.test.js messaging/tests/quoContacts.test.js messaging/tests/callIntake.test.js messaging/tests/ownerAssistant.test.js
      - name: Project status natural-language tests (synthetic GitHub data)
        run: node --test messaging/tests/projectStatus.test.js
      - name: Imperial brain source routing tests (synthetic records)
        run: node --test messaging/tests/imperialBrain.test.js
      - name: Run isolated Quo tests
        run: python -m pytest tests/test_quo_idempotency.py tests/test_imperial_tasks.py -q
