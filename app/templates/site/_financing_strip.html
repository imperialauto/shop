{% if financing %}
<aside class="finance-strip" aria-label="Financing">
  <div class="wrap finance-strip-inner">
    <div class="finance-strip-text">
      <span class="finance-badge">Financing available</span>
      <strong>Need your vehicle fixed now and pay over time?</strong>
      <span>Apply with Snap Finance. No credit needed.¹ Approvals from {{ financing.range }}.²</span>
    </div>
    <div class="finance-strip-actions">
      <a class="btn btn-gold" href="{{ financing.apply_path }}" rel="nofollow noopener" target="_blank">Apply with Snap</a>
      <a class="finance-more" href="/site/financing">How it works</a>
    </div>
  </div>
</aside>
{% endif %}
