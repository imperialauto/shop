<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verify login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/imperial.css">
  <style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; box-sizing: border-box; background: var(--imp-paper); color: var(--imp-ink); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
  main { width: 100%; max-width: 340px; }
  h1 { font-family: var(--imp-serif); font-size: 28px; color: var(--imp-heading); margin: 0 0 8px; }
  p { color: var(--imp-muted); font-size: 14px; margin: 0 0 16px; }
  label { display: block; font-size: 13px; color: var(--imp-muted); margin-bottom: 6px; }
  input { width: 100%; box-sizing: border-box; min-height: 48px; font-size: 18px; padding: 10px 12px; color: var(--imp-ink); background: var(--imp-surface); border: 1px solid var(--imp-line); border-radius: 8px; }
  button { width: 100%; min-height: 48px; margin-top: 12px; border: 0; border-radius: 8px; background: var(--imp-gold); color: var(--imp-purple-deep); font-size: 16px; font-weight: 600; }
  .error { color: #fca5a5; font-size: 14px; margin-bottom: 12px; }
  a { display: block; margin-top: 16px; color: var(--imp-muted); font-size: 14px; text-align: center; }
</style>
</head>
<body>
<main>
  <h1>Enter your code</h1>
  <p>Open your authenticator app and enter the 6-digit code for Imperial Operations. You can also use a recovery code.</p>
  {% if error %}<div class="error" role="alert">{{ error }}</div>{% endif %}
  <form method="post" action="/login/verify">
    <label for="code">Code</label>
    <input id="code" name="code" autocomplete="one-time-code" inputmode="text" autofocus required>
    <button type="submit">Verify</button>
  </form>
  <a href="/logout">Back to sign in</a>
</main>
</body>
</html>
