<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verify login</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; box-sizing: border-box; background: #09090b; color: #e4e4e7; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
  main { width: 100%; max-width: 340px; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { color: #a1a1aa; font-size: 14px; margin: 0 0 16px; }
  label { display: block; font-size: 13px; color: #a1a1aa; margin-bottom: 6px; }
  input { width: 100%; box-sizing: border-box; min-height: 48px; font-size: 18px; padding: 10px 12px; color: #fff; background: #18181b; border: 1px solid #3f3f46; border-radius: 8px; }
  button { width: 100%; min-height: 48px; margin-top: 12px; border: 0; border-radius: 8px; background: #d4a853; color: #111; font-size: 16px; font-weight: 600; }
  .error { color: #fca5a5; font-size: 14px; margin-bottom: 12px; }
  a { display: block; margin-top: 16px; color: #a1a1aa; font-size: 14px; text-align: center; }
</style>
</head>
<body>
<main>
  <h1>Enter your code</h1>
  <p>Open your authenticator app and enter the 6-digit code for Imperial Operations. You can also use a recovery code.</p>
  {% if error %}<div class="error" role="alert">{{ error }}</div>{% endif %}
  <form method="post" action="/login/verify">
    <label for="code">Code</label>
    <input id="code" name="code" autocomplete="one-time-code" inputmode="text" autofocus required>
    <button type="submit">Verify</button>
  </form>
  <a href="/logout">Back to sign in</a>
</main>
</body>
</html>
